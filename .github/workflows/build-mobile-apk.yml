name: Build SafeHouse Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile-v2-build/**'
      - 'scripts/patch-mobile-performance.mjs'
      - 'scripts/patch-mobile-financial-context.mjs'
      - 'scripts/patch-mobile-stability.mjs'
      - 'scripts/verify-mobile-runtime.mjs'
      - 'scripts/apply-runtime-stability.mjs'
      - 'src/**'
      - 'prisma/**'
      - 'package.json'
      - '.github/workflows/build-mobile-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct SafeHouse 2 mobile source
        shell: bash
        run: |
          cat mobile-v2-build/part-*.b64 > /tmp/mobile-source.b64
          base64 -d /tmp/mobile-source.b64 > /tmp/mobile-source.tar.gz
          tar -xzf /tmp/mobile-source.tar.gz
          test -f mobile/app/src/main/assets/index.html
          test -f mobile/app/src/main/java/com/safehouse/pg/MainActivity.java

      - name: Fix startup and Android safe areas
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('mobile/app/src/main/assets/index.html')
          source = path.read_text(encoding='utf-8')

          if 'async function boot()' not in source:
              raise SystemExit('SafeHouse boot() function is missing')
          if '\nboot();\n</script>' not in source:
              marker = source.rfind('</script>')
              if marker < 0:
                  raise SystemExit('Closing script tag not found')
              source = source[:marker] + '\nboot();\n' + source[marker:]

          safe_area_marker = 'SAFEHOUSE_ANDROID_TOP_INSET_FIX_V1'
          if safe_area_marker not in source:
              style_end = source.find('</style>')
              if style_end < 0:
                  raise SystemExit('Closing style tag not found')
              safe_css = '\n'.join([
                  '/* SAFEHOUSE_ANDROID_TOP_INSET_FIX_V1 */',
                  ':root{--safe-top:max(env(safe-area-inset-top),28px)}',
                  '.topbar{height:calc(62px + var(--safe-top))!important;padding:var(--safe-top) 16px 0!important;align-items:center!important}',
                  '.login-page{padding-top:var(--safe-top)!important}',
                  '.role-page{padding-top:calc(24px + var(--safe-top))!important}',
                  '.payment-state{min-height:100vh!important;padding-top:calc(28px + var(--safe-top))!important}',
                  '@media(min-width:700px){.role-page{padding-top:calc(32px + var(--safe-top))!important}}',
              ])
              source = source[:style_end] + safe_css + '\n' + source[style_end:]

          path.write_text(source, encoding='utf-8')
          fixed = path.read_text(encoding='utf-8')
          if '\nboot();\n</script>' not in fixed:
              raise SystemExit('SafeHouse boot invocation could not be installed')
          if safe_area_marker not in fixed:
              raise SystemExit('SafeHouse Android top inset fix could not be installed')
          print('SafeHouse startup and Android top safe-area verified')
          PY

      - name: Optimize Android navigation performance
        shell: bash
        run: |
          node scripts/patch-mobile-performance.mjs
          grep -q 'SAFEHOUSE_PERF_V1' mobile/app/src/main/assets/index.html

      - name: Apply strict property and month financial UI
        shell: bash
        run: |
          node scripts/patch-mobile-financial-context.mjs
          grep -q 'SAFEHOUSE_FINANCIAL_UI_V2' mobile/app/src/main/assets/index.html

      - name: Apply mobile runtime stability fixes
        shell: bash
        run: |
          node scripts/patch-mobile-stability.mjs
          node scripts/verify-mobile-runtime.mjs
          python - <<'PY'
          from pathlib import Path
          source = Path('mobile/app/src/main/assets/index.html').read_text(encoding='utf-8')
          a = source.index('<script>') + len('<script>')
          b = source.rindex('</script>')
          Path('/tmp/safehouse-mobile.js').write_text(source[a:b], encoding='utf-8')
          PY
          node --check /tmp/safehouse-mobile.js

      - name: Enable AndroidX
        shell: bash
        run: |
          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\n' > mobile/gradle.properties

      - name: Align Kotlin dependencies
        shell: bash
        run: |
          cat >> mobile/app/build.gradle <<'EOF'

          configurations.configureEach {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable APK
        id: build
        working-directory: mobile
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace > ../android-build.log 2>&1
          CODE=$?
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          tail -n 250 ../android-build.log
          exit 0

      - name: Publish result and diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p releases
          CODE="${{ steps.build.outputs.exit_code }}"
          if [ -z "$CODE" ]; then CODE="not-run"; fi
          {
            echo "SafeHouse 2 Android build"
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "build_exit_code=${CODE}"
            echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            if [ -f android-build.log ]; then tail -n 250 android-build.log; else echo "android-build.log not created"; fi
          } > releases/android-build-status.txt

          if [ "$CODE" = "0" ] && [ -f mobile/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp mobile/app/build/outputs/apk/debug/app-debug.apk releases/SafeHouse-Final-Live.apk
            sha256sum releases/SafeHouse-Final-Live.apk > releases/SafeHouse-Final-Live.apk.sha256
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/
          if ! git diff --cached --quiet; then
            git commit -m "SafeHouse 2 Android build result"
            git push origin HEAD:main
          fi

      - name: Upload APK artifact
        if: steps.build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: SafeHouse-Final-Live-APK
          path: releases/SafeHouse-Final-Live.apk
          if-no-files-found: error
          retention-days: 14

      - name: Fail workflow when Android build fails
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
