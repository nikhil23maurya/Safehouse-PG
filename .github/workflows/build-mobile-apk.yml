name: Build SafeHouse Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile-build/**'
      - '.github/workflows/build-mobile-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct mobile source
        shell: bash
        run: |
          cat mobile-build/part-*.b64 > /tmp/mobile-source.b64
          base64 -d /tmp/mobile-source.b64 > /tmp/mobile-source.tar.gz
          tar -xzf /tmp/mobile-source.tar.gz
          test -f mobile/app/src/main/assets/index.html
          test -f mobile/app/src/main/java/com/safehouse/pg/MainActivity.java

      - name: Enable AndroidX
        shell: bash
        run: |
          printf 'android.useAndroidX=true\nandroid.enableJetifier=true\n' > mobile/gradle.properties

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable APK
        id: build
        working-directory: mobile
        shell: bash
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace > ../android-build.log 2>&1
          CODE=$?
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          tail -n 250 ../android-build.log
          exit 0

      - name: Publish result and diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p releases
          CODE="${{ steps.build.outputs.exit_code }}"
          if [ -z "$CODE" ]; then CODE="not-run"; fi
          {
            echo "SafeHouse Android build"
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "build_exit_code=${CODE}"
            echo "utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            if [ -f android-build.log ]; then tail -n 250 android-build.log; else echo "android-build.log not created"; fi
          } > releases/android-build-status.txt

          if [ "$CODE" = "0" ] && [ -f mobile/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp mobile/app/build/outputs/apk/debug/app-debug.apk releases/SafeHouse-Final-Live.apk
            sha256sum releases/SafeHouse-Final-Live.apk > releases/SafeHouse-Final-Live.apk.sha256
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/
          if ! git diff --cached --quiet; then
            git commit -m "SafeHouse Android build result"
            git push origin HEAD:main
          fi

      - name: Upload APK artifact
        if: steps.build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: SafeHouse-Final-Live-APK
          path: releases/SafeHouse-Final-Live.apk
          if-no-files-found: error
          retention-days: 14

      - name: Fail workflow when Android build fails
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
