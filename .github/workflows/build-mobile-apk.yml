name: Build PGOne Android APK

on:
  workflow_dispatch:
  pull_request:
    paths: ['mobile/**', 'scripts/verify-mobile-source.mjs', 'scripts/android-smoke.sh', '.github/workflows/build-mobile-apk.yml']
  push:
    branches: [main]
    paths: ['mobile/**', 'scripts/verify-mobile-source.mjs', 'scripts/android-smoke.sh', '.github/workflows/build-mobile-apk.yml']

permissions:
  contents: read

concurrency:
  group: pgone-mobile-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: mobile/frontend/package-lock.json
      - name: Install locked frontend tooling
        working-directory: mobile/frontend
        run: npm ci
      - name: Unit and payment-state regression tests
        working-directory: mobile/frontend
        run: npm test
      - name: Bundle maintained frontend
        working-directory: mobile/frontend
        run: npm run build
      - name: Validate release asset inputs
        run: |
          node scripts/verify-mobile-source.mjs
          node --check mobile/app/src/main/assets/app.js
      - name: Install test browser
        working-directory: mobile/frontend
        run: npx playwright install --with-deps chromium
      - name: User journeys and four-size screenshot inventory
        working-directory: mobile/frontend
        run: npm run test:e2e
      - name: Upload visual evidence and test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PGOne-web-visual-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          overwrite: true
          path: |
            mobile/frontend/visual-evidence/
            mobile/frontend/playwright-report/
            mobile/frontend/test-results/
            mobile/frontend/build-meta.json
          retention-days: 30

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: mobile/frontend/package-lock.json
      - name: Install frontend and prepare separate instrumentation fixtures
        working-directory: mobile/frontend
        run: |
          npm ci
          node prepare-android-tests.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install compatible Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build testing APK and instrumentation APK
        working-directory: mobile
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace 2>&1 | tee ../android-build.log
      - name: Verify fresh APK integrity, identity and signature
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics/apk
          APK="mobile/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" > diagnostics/apk/zip-integrity.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" > diagnostics/apk/signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > diagnostics/apk/package.txt
          grep -q "name='com.safehouse.pg.testing'" diagnostics/apk/package.txt
          SOURCE_SHA="$(git rev-parse HEAD)"
          NAME="PGOne-5.0.0-testing-${SOURCE_SHA:0:12}.apk"
          cp "$APK" "diagnostics/apk/$NAME"
          (cd diagnostics/apk && sha256sum "$NAME" > "$NAME.sha256")
          printf 'commit=%s\nrun_id=%s\nkind=debug/testing\napplication_id=com.safehouse.pg.testing\n' "$SOURCE_SHA" "$GITHUB_RUN_ID" > diagnostics/apk/build-provenance.txt
      - name: Upload exact testing APK
        uses: actions/upload-artifact@v4
        with:
          name: PGOne-testing-APK-${{ github.event.pull_request.head.sha || github.sha }}
          overwrite: true
          path: diagnostics/apk/
          if-no-files-found: error
          retention-days: 30
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, launch and inspect the actual Android app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -noaudio -no-boot-anim -camera-back none
          script: |
            bash scripts/android-smoke.sh
      - name: Upload Android build and emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PGOne-Android-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}
          overwrite: true
          path: |
            android-build.log
            diagnostics/
            mobile/app/build/reports/
            mobile/app/build/outputs/androidTest-results/
          retention-days: 30
